<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinela AI</title>
  <script>
    // Bloqueio de atalhos de salvar/inspecionar a pagina (impedimento leve)
    window.addEventListener('keydown', function (e) {
      var k = (e.key || '').toLowerCase();
      var cmd = e.ctrlKey || e.metaKey;
      if (cmd && k === 's') { e.preventDefault(); e.stopPropagation(); }
      if (cmd && k === 'u') { e.preventDefault(); e.stopPropagation(); }
      if (k === 'f12') { e.preventDefault(); e.stopPropagation(); }
      if (cmd && e.shiftKey && ['i', 'j', 'c'].indexOf(k) > -1) { e.preventDefault(); e.stopPropagation(); }
    }, true);
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
